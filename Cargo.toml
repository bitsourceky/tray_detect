[package]
name = "tray_detect"
version = "0.1.0"
edition = "2021"

[dependencies]
# ONNX Runtime bindings. `download-binaries` (on by default) fetches a prebuilt
# ORT so school machines don't need anything installed separately.
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.16"

# Cross-platform camera capture (AVFoundation / v4l2 / Media Foundation).
nokhwa = { version = "0.10", features = ["input-native"] }

# Frame buffers, drawing boxes/labels, font rasterization.
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"

# Simple cross-platform window to show the live feed.
minifb = "0.28"

anyhow = "1"

# Vendored with a fix for a crash on cameras (e.g. Logitech Brio) that expose
# the same resolution in multiple pixel formats with different frame-rate
# limits: upstream pairs a format with a frame-rate range from a different
# format, and AVFoundation throws an uncaught exception. See vendor/README.md.
[patch.crates-io]
nokhwa-bindings-macos = { path = "vendor/nokhwa-bindings-macos" }

[profile.release]
opt-level = 3
lto = "thin"
